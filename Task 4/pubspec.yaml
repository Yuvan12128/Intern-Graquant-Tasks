name: skcl_vms
description: SKCL visitor mobile app.

publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  flutter_secure_storage: ^10.0.0
  dart_date: ^1.5.3
  get_it: ^9.2.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  json_annotation: ^4.11.0
  permission_handler: ^12.0.0+1
  firebase_crashlytics: ^5.2.0
  flutter_easyloading: ^3.0.5
  http: ^1.6.0
  infinite_scroll_pagination: ^5.1.0
  dotted_line: ^3.2.3
  image_picker: ^1.2.1
  flutter_launcher_icons: ^0.14.4
  flutter_bloc: ^9.1.1
  reactive_forms: ^18.2.2
  equatable: ^2.0.8
  url_launcher: ^6.3.1
  graphql: ^5.2.4
  graphql_codegen: ^3.0.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.1.1
  new_version_plus: ^1.0.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.14.1
  json_serializable: ^6.13.0
  
flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/error_page/
    - lib/env_property/skcl/skcl_dev.json
    - lib/env_property/skcl/skcl_prod.json

  fonts:
    - family: ProductSans
      fonts:
        - asset: assets/fonts/google_font/ProductSans-Black.ttf
          weight: 600 
        - asset: assets/fonts/google_font/ProductSans-BlackItalic.ttf
          weight: 600    
        - asset: assets/fonts/google_font/ProductSans-Bold.ttf
          weight: 500  
        - asset: assets/fonts/google_font/ProductSans-BoldItalic.ttf
          weight: 500  
        - asset: assets/fonts/google_font/ProductSans-Medium.ttf
          weight: 400  
        - asset: assets/fonts/google_font/ProductSans-MediumItalic.ttf
          weight: 400 
        - asset: assets/fonts/google_font/ProductSans-Regular.ttf
          weight: 300 
        - asset: assets/fonts/google_font/ProductSans-Italic.ttf
          weight: 300
        - asset: assets/fonts/google_font/ProductSans-Light.ttf
          weight: 200  
        - asset: assets/fonts/google_font/ProductSans-LightItalic.ttf
          weight: 200 
        - asset: assets/fonts/google_font/ProductSans-Thin.ttf
          weight: 100  
        - asset: assets/fonts/google_font/ProductSans-ThinItalic.ttf
          weight: 100
