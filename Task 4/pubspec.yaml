name: skcl_vms
description: SKCL visitor mobile app.

publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=2.14.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.5  
  dart_date: ^1.2.1
  get_it: ^7.2.0  
  firebase_core: ^2.12.0
  firebase_auth: ^4.6.0  
  json_annotation: ^4.8.1
  permission_handler: ^10.2.0  
  flutter_vibrate: ^1.3.0
  firebase_crashlytics: ^3.1.0
  flutter_easyloading: ^3.0.5  
  http: ^0.13.5
  infinite_scroll_pagination: ^3.2.0
  dotted_line: ^3.1.0
  image_picker: ^0.8.7+3    
  flutter_launcher_icons: ^0.13.0
  flutter_bloc: ^8.1.2
  reactive_forms: ^14.1.0
  equatable: ^2.0.5
  url_launcher: ^6.1.12
  graphql: ^5.1.3
  graphql_codegen: ^0.12.2
  cached_network_image: ^3.2.3    
  shared_preferences: ^2.1.0                      
  connectivity_plus: ^4.0.0
  new_version_plus: ^0.0.9
  package_info_plus: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.4
  json_serializable: ^6.7.0
  
flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/error_page/
    - lib/env_property/skcl/skcl_dev.json
    - lib/env_property/skcl/skcl_prod.json

  fonts:
    - family: ProductSans
      fonts:
        - asset: assets/fonts/google_font/ProductSans-Black.ttf
          weight: 600 
        - asset: assets/fonts/google_font/ProductSans-BlackItalic.ttf
          weight: 600    
        - asset: assets/fonts/google_font/ProductSans-Bold.ttf
          weight: 500  
        - asset: assets/fonts/google_font/ProductSans-BoldItalic.ttf
          weight: 500  
        - asset: assets/fonts/google_font/ProductSans-Medium.ttf
          weight: 400  
        - asset: assets/fonts/google_font/ProductSans-MediumItalic.ttf
          weight: 400 
        - asset: assets/fonts/google_font/ProductSans-Regular.ttf
          weight: 300 
        - asset: assets/fonts/google_font/ProductSans-Italic.ttf
          weight: 300
        - asset: assets/fonts/google_font/ProductSans-Light.ttf
          weight: 200  
        - asset: assets/fonts/google_font/ProductSans-LightItalic.ttf
          weight: 200 
        - asset: assets/fonts/google_font/ProductSans-Thin.ttf
          weight: 100  
        - asset: assets/fonts/google_font/ProductSans-ThinItalic.ttf
          weight: 100

dependency_overrides:
  win32: ^5.5.4
