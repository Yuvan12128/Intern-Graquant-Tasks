targets:
  $default:
    builders:
      graphql_codegen:
        options:
          scalars:
            Date:
              type: DateTime
            JSONObject:
              type: JsonObjectData
              import: 'package:skcl_vms/data/graphql/component/json_object_data.dart'
          clients:
            - graphql
          includeIfNullOnInput: false